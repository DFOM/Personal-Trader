services:
  # The Background Worker (AI Scanner)
  - type: worker
    name: trading-bot-scheduler
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler.py
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_7pmDjICkcsJ8@ep-floral-frost-a1t8ktx7-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

  # The Web Dashboard (Streamlit UI)
  - type: web
    name: trading-bot-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ui/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_7pmDjICkcsJ8@ep-floral-frost-a1t8ktx7-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require